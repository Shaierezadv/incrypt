<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PII Encryptor</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      header { margin-bottom: 16px; }
      nav a { margin-left: 12px; }
      .card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
      .btn { padding: 8px 12px; border: 1px solid #333; background: #f4f4f4; border-radius: 6px; text-decoration: none; color: #111; }
      .btn-primary { background: #2363eb; color: #fff; border-color: #1f4fce; }
      .btn-danger { background: #e11d48; color: #fff; border-color: #c01439; }
      input[type=file], input[type=text], select { padding: 6px; }
      .flash { background: #fff8c5; padding: 8px; border: 1px solid #f2e58a; border-radius: 6px; margin-bottom: 10px; }
      footer { margin-top: 32px; color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a class="btn" href="/">דף הבית</a>
        <a class="btn" href="/keys">מפתחות</a>
        <a class="btn" href="/encrypt">הצפנה</a>
        <a class="btn" href="/decrypt">פענוח</a>
        <a class="btn" href="/inspect">בדיקה</a>
      </nav>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <footer>
      לוקאלי בלבד. המפתחות נשמרים תחת ‎~/.pii_encryptor/‎.
    </footer>
  </body>
</html>
