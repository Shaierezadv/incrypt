{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>פענוח קובץ</h2>
  <form method="post" action="/decrypt" enctype="multipart/form-data">
    <div>
      <label>בחר קובץ (TXT/DOCX/PDF):</label>
      <input type="file" name="file" required>
    </div>
    <button class="btn btn-primary" type="submit">פענח והורד</button>
  </form>
  <p>המערכת תנסה לזהות את המפתח מתוך סימני המים. אם המפתח הלא נכון, הטוקנים יישארו כפי שהם.</p>
</div>
{% endblock %}
