{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>בדיקת קובץ</h2>
  <form method="post" action="/inspect" enctype="multipart/form-data">
    <div>
      <label>בחר קובץ (TXT/DOCX/PDF):</label>
      <input type="file" name="file" required>
    </div>
    <button class="btn" type="submit">בדוק</button>
  </form>
</div>
{% if info %}
<div class="card">
  <h3>תוצאות</h3>
  <pre>{{ info | tojson(indent=2, ensure_ascii=False) }}</pre>
</div>
{% endif %}
{% endblock %}
